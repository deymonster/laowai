name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsc --noEmit
      - run: npx tsc -p tsconfig.server.json --noEmit

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LAOWAI_DEPLOY_KEY }}
      - name: Trust host
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.LAOWAI_SSH_PORT }}" -H "${{ secrets.LAOWAI_SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Sync and rebuild
        env:
          HOST: ${{ secrets.LAOWAI_SSH_HOST }}
          PORT: ${{ secrets.LAOWAI_SSH_PORT }}
          USER: ${{ secrets.LAOWAI_SSH_USER }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude node_modules \
            --exclude dist \
            --exclude .git \
            --exclude '*.log' \
            --exclude .DS_Store \
            --exclude .playwright-mcp \
            -e "ssh -p $PORT" \
            ./ "$USER@$HOST:/opt/laowai/"
          ssh -p "$PORT" "$USER@$HOST" "cd /opt/laowai && docker compose up -d --build"
